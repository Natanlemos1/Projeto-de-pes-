<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastros | Representações Sansana</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        --primary: #2457d6;
        --primary-dark: #163d9f;
        --text: #182238;
        --muted: #657089;
        --border: #dbe2ef;
        --danger: #b42318;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: #f4f7fc;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 2rem;
        color: #ffffff;
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      }

      .brand {
        font-size: 1.1rem;
        font-weight: 800;
      }

      .logout-button {
        min-height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 8px;
        padding: 0.5rem 1rem;
        color: #ffffff;
        background: transparent;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: calc(100vh - 72px);
      }

      .sidebar {
        padding: 1.5rem 1rem;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }

      .nav-button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        padding: 0.75rem 1rem;
        color: var(--text);
        background: transparent;
        font: inherit;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
      }

      .nav-button:hover,
      .nav-button[aria-current="page"] {
        color: var(--primary);
        background: #edf3ff;
      }

      .content {
        min-width: 0;
        padding: 2rem;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .page-header h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.25rem);
      }

      .primary-button,
      .secondary-button,
      .danger-button,
      .icon-button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .primary-button {
        color: #ffffff;
        background: var(--primary);
      }

      .secondary-button {
        border: 1px solid var(--border);
        color: var(--text);
        background: #ffffff;
      }

      .danger-button,
      .icon-button {
        color: var(--danger);
        background: #fff1f0;
      }

      .icon-button {
        min-height: 36px;
        margin-right: 0.35rem;
        padding: 0.45rem 0.65rem;
      }

      .panel {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        white-space: nowrap;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 0.85rem 1rem;
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 0.875rem;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .empty-state {
        margin: 0;
        padding: 2.5rem 1rem;
        color: var(--muted);
        text-align: center;
      }

      .dialog {
        width: min(620px, calc(100vw - 2rem));
        border: 0;
        border-radius: 12px;
        padding: 0;
        color: var(--text);
      }

      .dialog::backdrop {
        background: rgba(24, 34, 56, 0.48);
      }

      .dialog-header,
      .dialog-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 1.5rem;
      }

      .dialog-header {
        border-bottom: 1px solid var(--border);
      }

      .dialog-header h2,
      .dialog-footer p {
        margin: 0;
      }

      .dialog-body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        padding: 1.5rem;
      }

      .form-field {
        min-width: 0;
      }

      .form-field--full {
        grid-column: 1 / -1;
      }

      .form-field label {
        display: block;
        margin-bottom: 0.45rem;
        font-weight: 700;
      }

      .form-field input,
      .form-field select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.65rem 0.75rem;
        color: var(--text);
        background: #ffffff;
        font: inherit;
      }

      .dialog-footer {
        justify-content: flex-end;
        border-top: 1px solid var(--border);
      }

      .status-message {
        min-height: 24px;
        margin: 0 0 1rem;
        color: var(--danger);
      }

      .status-message[hidden] {
        display: none;
      }

      @media (max-width: 760px) {
        .topbar {
          padding: 1rem;
        }

        .brand {
          max-width: 220px;
          font-size: 0.95rem;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: flex;
          gap: 0.5rem;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding: 0.75rem 1rem;
        }

        .nav-button {
          margin: 0;
          text-align: center;
        }

        .content {
          padding: 1.25rem 1rem;
        }

        .page-header {
          align-items: flex-start;
        }

        .dialog-body {
          grid-template-columns: 1fr;
        }

        .form-field--full {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">Representações Comerciais Sansana Ltda.</div>
        <button id="logout-button" class="logout-button" type="button">Sair</button>
      </header>

      <div class="layout">
        <nav class="sidebar" aria-label="Menu principal">
          <button id="companies-nav" class="nav-button" type="button" aria-current="page">
            Gerenciar empresa
          </button>
          <button id="clients-nav" class="nav-button" type="button">
            Gerenciar cliente
          </button>
        </nav>

        <section class="content" aria-live="polite">
          <div class="page-header">
            <h1 id="page-title">Gerenciar empresa</h1>
            <button id="new-button" class="primary-button" type="button">Novo cadastro</button>
          </div>

          <p id="status-message" class="status-message" hidden></p>
          <div class="panel">
            <table>
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <dialog id="record-dialog" class="dialog">
      <form id="record-form">
        <header class="dialog-header">
          <h2 id="dialog-title">Novo cadastro</h2>
          <button id="close-dialog" class="secondary-button" type="button">Fechar</button>
        </header>
        <div id="dialog-body" class="dialog-body"></div>
        <footer class="dialog-footer">
          <button class="secondary-button" type="button" id="cancel-button">Cancelar</button>
          <button class="primary-button" type="submit">Salvar</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="./src/dashboard.js"></script>
  </body>
</html>
